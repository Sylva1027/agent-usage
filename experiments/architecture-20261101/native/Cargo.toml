[package]
name = "architecture-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["sqlite", "redb", "duckdb"]
sqlite = ["dep:rusqlite"]
redb = ["dep:redb"]
duckdb = ["dep:duckdb"]

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
ctrlc = "3.5.2"
duckdb = { version = "1.20000.1", default-features = false, features = ["bundled"], optional = true }
redb = { version = "4.4.0", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tiny_http = "0.12.0"
