name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Use canonical Windows temp paths
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Set up browser checks
        env:
          AGENT_USAGE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/agent-usage-browser/node_modules/playwright/index.mjs
        run: |
          npm.cmd install --prefix "$env:RUNNER_TEMP/agent-usage-browser" --no-package-lock --no-save playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENT_USAGE_PLAYWRIGHT_MODULE=$env:AGENT_USAGE_PLAYWRIGHT_MODULE" >> $env:GITHUB_ENV
      - name: Build matching Windows helper
        run: |
          npm.cmd run native:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run native:check
      - name: Run full Windows suite
        timeout-minutes: 20
        run: node --test --test-reporter=spec --test-concurrency=4 --test-timeout=720000 "test/**/*.test.js"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Package and accept both release ZIPs
        if: matrix.node-version == 24
        timeout-minutes: 10
        run: |
          npm.cmd run package:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run package:check -- output/releases --browser
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node-version == 24
        with:
          name: agent-usage-windows
          path: |
            output/releases/*.zip
            output/releases/release-manifest.json
            output/releases/acceptance-*.json
          if-no-files-found: ignore
