name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Use canonical Windows temp paths
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Set up browser checks
        env:
          AGENT_USAGE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/agent-usage-browser/node_modules/playwright/index.mjs
        run: |
          npm.cmd install --prefix "$env:RUNNER_TEMP/agent-usage-browser" --no-package-lock --no-save playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENT_USAGE_PLAYWRIGHT_MODULE=$env:AGENT_USAGE_PLAYWRIGHT_MODULE" >> $env:GITHUB_ENV
      - name: Build matching Windows helper
        run: |
          npm.cmd run native:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run native:check
      - name: Run full Windows suite
        timeout-minutes: 30
        run: npm test -- --test-reporter=spec --test-concurrency=4 --test-timeout=720000
      - name: Run explicit Windows native acceptance
        timeout-minutes: 10
        env:
          Q6_TEST_HELPER: ${{ github.workspace }}/native/windows-source-proof/bin/windows-source-proof.exe
          ARCHIVE_NATIVE_TEST_HELPER: ${{ github.workspace }}/native/windows-source-proof/bin/windows-source-proof.exe
          Q6_TEST_TRACE: ${{ runner.temp }}/hermes-native-trace
          AGENT_USAGE_TEST_NATIVE_BUILD: "1"
        run: |
          New-Item -ItemType Directory -Path "$env:Q6_TEST_TRACE" -Force | Out-Null
          $env:TEMP = Join-Path $env:LOCALAPPDATA "Temp"
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Path "$env:TEMP" -Force | Out-Null
          npm.cmd test -- --test-reporter=spec --test-concurrency=1 test/usage-source-acquisition.test.js test/usage-source-additions.test.js test/usage-source-coalescing.test.js test/usage-source-directory.test.js test/final-status-version.test.js test/usage-source-acquisition-server.test.js test/history-archive-native-lock.test.js test/windows-source-build.test.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Package and accept both release ZIPs
        if: matrix.node-version == 24
        timeout-minutes: 10
        run: |
          npm.cmd run package:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run package:check -- output/releases --browser
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node-version == 24
        with:
          name: agent-usage-windows
          path: |
            output/releases/*.zip
            output/releases/release-manifest.json
            output/releases/acceptance-*.json
          if-no-files-found: ignore
